  <div class="mgmt-inner">

      <span class="mgmt-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><ellipse cx="10.5" cy="14.5" rx="5.8" ry="3.6" transform="rotate(-20 10.5 14.5)"/><circle cx="16.7" cy="10.3" r="2.3"/><ellipse cx="7.2" cy="9.2" rx="3.9" ry="1.6" transform="rotate(-40 7.2 9.2)"/><ellipse cx="12.4" cy="8.5" rx="3.3" ry="1.5" transform="rotate(-34 12.4 8.5)"/><path d="M5.4 16.6 2.4 19.2 6.2 18.4Z"/><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M16.5 7.9 17 6.1"/><path d="M18.2 8.4 19.5 7"/></g></svg>
      </span>
      <span class="mgmt-title">个人管理</span>
    </a>
    <nav class="mgmt-tabs" aria-label="个人管理子页面">
      <a class="mgmt-tab{{ ' is-active' if active_page == 'planner' }}" href="/planner">项目计划</a>
      <a class="mgmt-tab{{ ' is-active' if active_page == 'schedule' }}" href="/schedule">日程安排</a>
      <a class="mgmt-tab{{ ' is-active' if active_page == 'sport' }}" href="/sport">体育兴趣</a>
      <a class="mgmt-tab{{ ' is-active' if active_page == 'study' }}" href="/time">时间统计</a>
      <a class="mgmt-tab{{ ' is-active' if active_page == 'journal' }}" href="/journal">工作日志</a>
    </nav>
    <time class="mgmt-clock" id="mgmtClock">
      <span class="clock-date" id="clockDate">—</span>
      <span class="clock-time" id="clockTime">--:--</span>
    </time>
  </div>
</header>
